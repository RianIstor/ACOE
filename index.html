        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Твой конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyDVV5jIHsH4CS1_utz1thzgJ2c04kxV7AM",
            authDomain: "sergey-game.firebaseapp.com",
            projectId: "sergey-game",
            storageBucket: "sergey-game.firebasestorage.app",

            measurementId: "G-9YEXXVK29W"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("✅ Firebase Ready");
        } catch (e) {
            console.error("❌ Error:", e);
        }

        class WorkingGame {
            constructor() {
                this.db = db;
                this.playerId = crypto.randomUUID();
                this.roomId = null;
                
                // Состояние игры
                this.gameActive = false;
                this.remotePlayers = []; 
                
                // Моя позиция (мировая)
                this.myX = 0;
                this.myY = 0;
                
                // Камера
                this.camX = 0;
                this.camY = 0;

                // Canvas
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Input State
                this.keysPressed = {};
                
                // Параметры движения
                this.moveSpeed = 10; // Высокая скорость для теста
                
                // Network Throttle
                this.lastSendTime = 0;
                this.sendInterval = 50;

                this.initInput();
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * dpr;
                this.canvas.height = window.innerHeight * dpr;
                this.ctx.scale(dpr, dpr);
                this.w = window.innerWidth;
                this.h = window.innerHeight;
            }

            initInput() {
                // Ключевое исправление: Слушаем глобально и блокируем скролл
                window.addEventListener('keydown', (e) => {
                    // Блокируем стандартное поведение стрелок и пробела
                    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) {
                        e.preventDefault();
                    }
                    
                    // Запоминаем нажатие по коду клавиши (не зависит от языка!)
                    this.keysPressed[e.code] = true;
                    
                    // Для дебага
                    if(!this.gameActive) console.log("Key pressed:", e.code);
                });

                window.addEventListener('keyup', (e) => {
                    this.keysPressed[e.code] = false;
                });
                
                // Фокус на окно при клике, чтобы гарантировать получение событий
                window.addEventListener('click', () => {
                    if(this.gameActive) {
                         this.canvas.focus();
                    }
                });
            }

            async joinOrCreate() {
                document.getElementById('ui').style.display = 'none';
                
                // Фокусируемся на канвасе сразу после старта
                setTimeout(() => this.canvas.focus(), 100);

                try {
                    const q = query(collection(this.db, "rooms"), where("count", "<", 4), limit(1));
                    const snapshot = await getDocs(q);

                    if (!snapshot.empty) {
                        const roomDoc = snapshot.docs[0];
                        this.roomId = roomDoc.id;
                        await this.joinRoom(roomDoc.data().players);
                    } else {
                        const newPlayer = { id: this.playerId, x: 0, y: 0 };
                        const docRef = await addDoc(collection(this.db, "rooms"), {
                            players: [newPlayer],
                            count: 1,
                            createdAt: serverTimestamp()
                        });
                        this.roomId = docRef.id;
                        this.startListening();
                    }
                } catch (err) {
                    alert("Ошибка сети: " + err.message);
                    location.reload();
                }
            }

            async joinRoom(currentPlayers) {
                await runTransaction(this.db, async (transaction) => {
                    const ref = doc(this.db, "rooms", this.roomId);
                    const snap = await transaction.get(ref);
                    if (!snap.exists()) throw new Error("Комната исчезла");
                    
                    const data = snap.data();
                    if (data.count >= 4) throw new Error("Комната полна");

                    const offset = Math.random() * 100 - 50;
                    const newMe = { id: this.playerId, x: offset, y: offset };
                    
                    transaction.update(ref, {
                        players: [...data.players, newMe],
                        count: data.players.length + 1
                    });
                });
                
                this.startListening();
            }

            startListening() {
                this.gameActive = true;
                this.canvas.style.display = 'block';
                
                onSnapshot(doc(this.db, "rooms", this.roomId), (docSnap) => {
                    if (!docSnap.exists()) return;
                    this.remotePlayers = docSnap.data().players;
                }, (err) => {
                    console.error(err);
                });
                
                this.loop();
            }

            loop() {
                if (!this.gameActive) return;

                // 1. ЛОГИКА ДВИЖЕНИЯ (САМАЯ ПРОСТАЯ И НАДЕЖНАЯ)
                let dx = 0;
                let dy = 0;

                // Проверяем конкретные коды клавиш
                if (this.keysPressed['KeyW'] || this.keysPressed['ArrowUp']) dy -= 1;
                if (this.keysPressed['KeyS'] || this.keysPressed['ArrowDown']) dy += 1;
                if (this.keysPressed['KeyA'] || this.keysPressed['ArrowLeft']) dx -= 1;
                if (this.keysPressed['KeyD'] || this.keysPressed['ArrowRight']) dx += 1;

                // Если есть движение
                if (dx !== 0 || dy !== 0) {
                    // Нормализуем диагональ, чтобы не бегать быстрее по углам
                    const length = Math.sqrt(dx*dx + dy*dy);
                    dx /= length;
                    dy /= length;

                    // Обновляем мировую позицию
                    this.myX += dx * this.moveSpeed;
                    this.myY += dy * this.moveSpeed;
                    
                    // Отправляем в базу
                    const now = Date.now();
                    if (now - this.lastSendTime > this.sendInterval) {
                        this.updateMyPos(this.myX, this.myY);
                        this.lastSendTime = now;
                    }
                }

                // 2. КАМЕРА
                // Плавно следуем за собой
                this.camX += (this.myX - this.camX) * 0.1;
                this.camY += (this.myY - this.camY) * 0.1;

                // 3. РЕНДЕР
                const ctx = this.ctx;
                const w = this.w;
                const h = this.h;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);

                const screenCenterX = w / 2;
                const screenCenterY = h / 2;

                const worldToScreen = (wx, wy) => ({
                    x: wx - this.camX + screenCenterX,
                    y: wy - this.camY + screenCenterY
                });

                // Сетка
                this.drawGrid(ctx, worldToScreen);

                // Центр мира
                this.drawCenterCross(ctx, worldToScreen);

                // Другие игроки
                this.remotePlayers.forEach(p => {
                    if (p.id === this.playerId) return;
                    const pos = worldToScreen(p.x, p.y);
                    if (pos.x > -50 && pos.x < w + 50 && pos.y > -50 && pos.y < h + 50) {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff4444';
                        ctx.fill();
                    }
                });

                // Я
                const myPos = worldToScreen(this.myX, this.myY);
                ctx.beginPath();
                ctx.arc(myPos.x, myPos.y, 12, 0, Math.PI * 2);

                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
