<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Multiplayer Demo</title>
    
    <!-- Подключаем библиотеку PeerJS для прямого соединения браузеров -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --card-bg: #2a2a2a;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff4444;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            padding: 24px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
        
        .screen { display: none; animation: fadeIn 0.3s; flex-grow: 1; overflow-y: auto; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        input[type="text"] {
            width: 100%; padding: 12px; background: #1f1f1f; border: 1px solid #444;
            border-radius: 8px; color: white; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #00ddbb; }
        .btn-secondary { background: #444; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* Lobby Styles */
        .room-info-box {
            background: #1f1f1f; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px;
        }
        .code-display {
            font-size: 2rem; font-family: monospace; color: var(--accent); letter-spacing: 3px; margin: 10px 0; user-select: all;
        }
        .players-list { list-style: none; margin-top: 10px; }
        .player-item {
            display: flex; justify-content: space-between; padding: 10px;
            background: #252525; margin-bottom: 5px; border-radius: 6px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: green; display: inline-block; margin-right: 5px; }
        
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: white; padding: 10px 20px;
            border-radius: 20px; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        #toast.show { opacity: 1; }

        canvas { width: 100%; height: 300px; background: #000; border-radius: 8px; margin-top: 10px; display: block;}
        
        .loading-text { text-align: center; color: var(--text-muted); margin-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- 1. Меню -->
    <div id="menu-screen" class="screen active">
        <h1>P2P NetPlay</h1>
        <div class="input-group">
            <label>Ваш никнейм:</label>
            <input type="text" id="nickname" placeholder="Игрок_1" value="">
        </div>
        <button class="btn-primary" onclick="gameApp.createRoom()">Создать комнату</button>
        <div style="margin: 15px 0; text-align: center; color: var(--text-muted)">— или —</div>
        <div class="input-group">
            <label>Код комнаты друга:</label>
            <input type="text" id="join-code" placeholder="XXXXXX" maxlength="6">
        </div>
        <button class="btn-outline" onclick="gameApp.joinRoom()">Присоединиться</button>
        <div class="loading-text" id="status-msg">Готов к работе</div>
    </div>

    <!-- 2. Лобби -->
    <div id="lobby-screen" class="screen">
        <h1>Лобби</h1>
        <div class="room-info-box">
            <p style="color:var(--text-muted)">Передай этот код другу:</p>
            <div class="code-display" id="display-room-code">------</div>
            <p style="font-size:0.8rem; color:var(--text-muted)" id="role-label">Вы: Хост</p>
        </div>
        
        <label>Игроки (<span id="player-count">1</span>):</label>
        <ul class="players-list" id="players-list"></ul>

        <button class="btn-primary" id="start-game-btn" onclick="gameApp.startGame()" disabled>Начать игру</button>
        <button class="btn-danger" onclick="gameApp.leaveRoom()">Выйти</button>
    </div>

    <!-- 3. Игра -->
    <div id="game-screen" class="screen">
        <h1>Игра запущена</h1>
        <canvas id="game-canvas"></canvas>
        <button class="btn-secondary" onclick="gameApp.returnToLobby()">Вернуться в лобби</button>
    </div>

</div>

<div id="toast"></div>

<script>
/**
 * Потоковая передача данных через PeerJS
 * Использует бесплатный signaling server peerjs.com
 */
class NetworkService {
    constructor() {
        this.peer = null;
        this.connections = {}; // Map: playerId -> DataConnection
        this.myId = null;
        this.onDataCallback = null;
        this.onConnectCallback = null;
        this.onDisconnectCallback = null;
    }

    init(nickname) {
        return new Promise((resolve, reject) => {
            // Генерируем случайный ID для комнаты (короткий код)
            const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // Инициализируем Peer. 
            // Важно: ID пира должен быть уникальным. Мы используем roomCode + suffix для хоста.
            // Но PeerJS требует уникальный глобальный ID. 
            // Простая схема: Хост имеет ID "HOST_" + Code. Гость подключается к нему.
            
            this.peer = new Peer(`NETPLAY_HOST_${roomCode}`, { debug: 1 });
            
            this.peer.on('open', (id) => {
                this.myId = id;
                console.log("My Peer ID:", id);
                resolve(roomCode);
            });

            this.peer.on('connection', (conn) => {
                conn.on('open', () => {
                    console.log("New connection established with:", conn.peer);
                    this.connections[conn.peer] = conn;
                    
                    // Отправляем приветствие новому игроку
                    conn.send({ type: 'WELCOME', senderId: this.myId, nickname: nickname });
                    
                    if(this.onConnectCallback) this.onConnectCallback(conn.peer, conn);
                });

                conn.on('data', (data) => {
                    if(this.onDataCallback) this.onDataCallback(data, conn.peer);
                });

                conn.on('close', () => {
                    delete this.connections[conn.peer];
                    if(this.onDisconnectCallback) this.onDisconnectCallback(conn.peer);
                });
            });

            this.peer.on('error', (err) => {
                console.error("Peer Error:", err);
                reject(err);
            });
        });
    }

    connectToHost(hostCode) {
        return new Promise((resolve, reject) => {
            const hostId = `NETPLAY_HOST_${hostCode}`;
            const conn = this.peer.connect(hostId);
            
            conn.on('open', () => {
                console.log("Connected to Host");
                this.connections[hostId] = conn;
                resolve(conn);
            });

            conn.on('data', (data) => {
                if(this.onDataCallback) this.onDataCallback(data, hostId);
            });

            conn.on('close', () => {
                delete this.connections[hostId];
                if(this.onDisconnectCallback) this.onDisconnectCallback(hostId);
            });
            
            conn.on('error', (err) => {
                reject(err);
            });
        });
    }

    sendToAll(messageObj) {
        Object.values(this.connections).forEach(conn => {
            if (conn.open) {
                conn.send(messageObj);
            }
        });
    }

    sendTo(peerId, messageObj) {
        if (this.connections[peerId]) {
            this.connections[peerId].send(messageObj);
        }
    }

    destroy() {
        if (this.peer) {
            this.peer.destroy();
        }
        this.connections = {};
    }
}

class GameApplication {
    constructor() {
        this.net = new NetworkService();
        this.playerId = crypto.randomUUID(); // Локальный UUID игрока
        this.nickname = '';
        this.roomCode = null;
        this.isHost = false;
        this.players = []; // [{id, nickname, isHost}]
        this.gameLoopId = null;
        this.canvasCtx = null;
        this.gameObjects = [];

        this.screens = {
            menu: document.getElementById('menu-screen'),
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen')
        };
        
        this.ui = {
            nicknameInput: document.getElementById('nickname'),
            joinCodeInput: document.getElementById('join-code'),
            statusMsg: document.getElementById('status-msg'),
            roomCodeDisplay: document.getElementById('display-room-code'),
            roleLabel: document.getElementById('role-label'),
            playersList: document.getElementById('players-list'),
            playerCount: document.getElementById('player-count'),
            startBtn: document.getElementById('start-game-btn'),
            toast: document.getElementById('toast')
        };

        this.bindEvents();
        this.setupNetworkCallbacks();
        
        // Default nick
        this.ui.nicknameInput.value = `Player_${Math.floor(Math.random() * 1000)}`;
    }

    bindEvents() {
        this.ui.joinCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.joinRoom();
        });
    }

    showToast(msg) {
        this.ui.toast.textContent = msg;
        this.ui.toast.classList.add('show');
        setTimeout(() => this.ui.toast.classList.remove('show'), 3000);
    }

    switchScreen(screenName) {
        Object.values(this.screens).forEach(el => el.classList.remove('active'));
        this.screens[screenName].classList.add('active');
    }

    setupNetworkCallbacks() {
        // Обработка входящих данных
        this.net.onDataCallback = (data, senderPeerId) => {
            this.handleIncomingMessage(data, senderPeerId);
        };

        // Кто-то подключился (для Хоста)
        this.net.onConnectCallback = (newPeerId, conn) => {
            if (!this.isHost) return;
            
            // Ждем WELCOME сообщение от гостя, чтобы узнать его имя
            // Но мы можем заранее добавить плейсхолдер, если хотим
            
            // Отправляем текущий список игроков новому подключившемуся
            this.net.sendTo(newPeerId, {
                type: 'SYNC_PLAYERS',
                players: this.players,
                roomCode: this.roomCode
            });
        };

        // Кто-то отключился
        this.net.onDisconnectCallback = (disconnectedPeerId) => {
            // Удаляем игрока по peerId
            const index = this.players.findIndex(p => p.peerId === disconnectedPeerId);
            if (index > -1) {
                const removedNick = this.players[index].nickname;
                this.players.splice(index, 1);
                this.updateLobbyUI();
                this.showToast(`${removedNick} вышел`);
                
                // Синхронизируем остальных
                if (this.isHost) {
                    this.net.sendToAll({ type: 'SYNC_PLAYERS', players: this.players });
                }
            }
        };
    }

    handleIncomingMessage(data, senderPeerId) {
        switch (data.type) {
            case 'WELCOME':
                // Получили имя от нового игрока (мы Хост)
                if (this.isHost) {
                    // Проверяем, нет ли такого уже
                    if (!this.players.find(p => p.peerId === senderPeerId)) {
                        this.players.push({
                            id: data.senderId, // UUID игрока
                            peerId: senderPeerId, // ID в сети PeerJS
                            nickname: data.nickname,
                            isHost: false
                        });
                        this.updateLobbyUI();
                        this.showToast(`${data.nickname} присоединился!`);
                        
                        // Рассылаем обновленный список всем остальным
                        this.net.sendToAll({ type: 'SYNC_PLAYERS', players: this.players });
                    }
                }
                break;

            case 'SYNC_PLAYERS':
                // Мы получили полный список игроков от Хоста (мы Гость)
                if (!this.isHost) {
                    this.players = data.players;
                    this.roomCode = data.roomCode;
                    this.updateLobbyUI();
                    this.showToast("Список игроков обновлен");
                }
                break;

            case 'GAME_START':
                // Хост дал старт
                this.startGameLoop();
                break;
                
            case 'MOVE_UPDATE':
                // Обновление позиции другого игрока во время игры
                this.updateRemoteObject(data.objectId, data.x, data.y);
                break;
        }
    }

    async createRoom() {
        this.nickname = this.ui.nicknameInput.value.trim() || "Host";
        this.ui.statusMsg.textContent = "Инициализация сети...";
        
        try {
            // Инициализируем сеть, получаем код комнаты
            this.roomCode = await this.net.init(this.nickname);
            this.isHost = true;
            
            // Добавляем себя в список
            this.players = [{
                id: this.playerId,
                peerId: this.net.myId,
                nickname: this.nickname,
                isHost: true
            }];
            
            this.enterLobby();
            this.ui.statusMsg.textContent = "Комната создана";
        } catch (err) {
            this.ui.statusMsg.textContent = "Ошибка сети: " + err.message;
            alert("Не удалось создать комнату. Проверьте консоль.");
        }
    }

    async joinRoom() {
        const code = this.ui.joinCodeInput.value.trim().toUpperCase();
        if (!code) {
            this.showToast("Введите код комнаты");
            return;
        }

        this.nickname = this.ui.nicknameInput.value.trim() || "Guest";
        this.ui.statusMsg.textContent = "Подключение к хосту...";
        
        try {
            // Сначала нужно инициализировать свой пир с любым уникальным ID
            // PeerJS требует, чтобы каждый клиент имел свой ID.
            // Мы создадим временный ID для клиента.
            const clientCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            await this.net.init(clientCode); 
            
            // Теперь подключаемся к хосту
            await this.net.connectToHost(code);
            
            this.isHost = false;
            this.roomCode = code;
            
            // Отправляем свое имя хосту
            this.net.sendTo(`NETPLAY_HOST_${code}`, {
                type: 'WELCOME',
                senderId: this.playerId,
                nickname: this.nickname
            });
            
            this.enterLobby();
            this.ui.statusMsg.textContent = "Подключено";
        } catch (err) {
            console.error(err);
            this.ui.statusMsg.textContent = "Ошибка подключения";
            this.showToast("Не удалось подключиться. Проверьте код.");
            this.net.destroy(); // Чистим неудачную попытку
        }
    }

    enterLobby() {
        this.ui.roomCodeDisplay.textContent = this.roomCode;
        this.ui.roleLabel.textContent = this.isHost ? "Вы: Хост" : "Вы: Гость";
        this.updateLobbyUI();
        this.switchScreen('lobby');
    }

    updateLobbyUI() {
        this.ui.playersList.innerHTML = '';
        this.players.forEach(player => {
            const li = document.createElement('li');
            li.className = 'player-item';
            li.innerHTML = `
                <span>${player.nickname}</span>
                <span><span class="status-dot"></span>${player.isHost ? 'Хост' : 'Гость'}</span>
            `;
            this.ui.playersList.appendChild(li);
        });
        
        this.ui.playerCount.textContent = this.players.length;

        // Кнопка старта доступна только хосту и если есть минимум 2 игрока
        const canStart = this.isHost && this.players.length >= 2;
        this.ui.startBtn.disabled = !canStart;
        this.ui.startBtn.style.opacity = canStart ? 1 : 0.5;
    }

    leaveRoom() {
        this.net.destroy();
        this.resetGame();
        this.switchScreen('menu');
        this.showToast("Вы вышли из комнаты");
    }

    resetGame() {
        this.roomCode = null;
        this.isHost = false;
        this.players = [];
        this.stopGameLoop();
    }

    startGame() {
        if (!this.isHost) return;
        this.net.sendToAll({ type: 'GAME_START' });
        this.startGameLoop();
    }

    startGameLoop() {
        this.switchScreen('game');
        this.initCanvas();
    }

    returnToLobby() {
        this.stopGameLoop();
        this.switchScreen('lobby');
        this.updateLobbyUI();
    }

    stopGameLoop() {
        cancelAnimationFrame(this.gameLoopId);
    }

    // --- Canvas & Game Logic ---
    initCanvas() {
        const canvas = document.getElementById('game-canvas');
        this.canvasCtx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        this.canvasCtx.scale(dpr, dpr);

        // Создаем объекты для каждого игрока
        this.gameObjects = this.players.map((p, index) => ({
            objectId: p.id,
            x: 50 + index * 40,
            y: 50 + index * 20,
            radius: 12,
            color: p.isHost ? '#00ffcc' : ['#ff4444', '#4488ff', '#ffff44'][index % 3],
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            isLocal: p.id === this.playerId
        }));

        this.loop();
    }

    loop() {
        if (!this.canvasCtx) return;
        
        const ctx = this.canvasCtx;
        const w = ctx.canvas.clientWidth;
        const h = ctx.canvas.clientHeight;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        this.gameObjects.forEach(obj => {
            // Движение только локального объекта
            if (obj.isLocal) {
                obj.x += obj.vx;
                obj.y += obj.vy;

                // Столкновения со стенами
                if (obj.x < obj.radius || obj.x > w - obj.radius) obj.vx *= -1;
                if (obj.y < obj.radius || obj.y > h - obj.radius) obj.vy *= -1;
                
                // Отправка позиции другим игрокам (упрощенно, каждые кадры)
                // В реальном проекте это оптимизируется интерполяцией
                this.net.sendToAll({
                    type: 'MOVE_UPDATE',
                    objectId: obj.objectId,
                    x: obj.x,
                    y: obj.y
                });
            }

            // Рисуем всех
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
            ctx.fillStyle = obj.color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        this.gameLoopId = requestAnimationFrame(() => this.loop());
    }

    updateRemoteObject(objectId, newX, newY) {
        const obj = this.gameObjects.find(o => o.objectId === objectId);
        if (obj && !obj.isLocal) {
            obj.x = newX;
            obj.y = newY;
        }
    }
}

const gameApp = new GameApplication();
</script>
</body>
</html>
