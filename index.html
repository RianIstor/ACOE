<body>

<div id="custom-cursor"></div>
<div id="net-status">Сеть: --</div>

<!-- ЭКРАН МЕНЮ / ЛОББИ -->
<div id="menu-screen">
    <h2>DARK SURVIVAL</h2>
    
    <div style="margin-bottom: 15px;">
        <input type="text" id="nickname-input" placeholder="Ваш никнейм..." maxlength="12" value="">
    </div>

    <div style="margin-bottom: 20px;">
        <button class="btn-primary" id="btn-play-single">ИГРАТЬ ОДИН (OFFLINE)</button>
        <br>
        <button class="btn-success" id="btn-create-multi">СОЗДАТЬ МУЛЬТИПЛЕР</button>
    </div>
    
    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
    
    <div>
        <p style="font-size: 12px; color: #888;">Присоединиться по ID:</p>
        <input type="text" id="join-input" placeholder="ID комнаты..." maxlength="10" autocomplete="off">
        <button id="btn-join">ВОЙТИ</button>
    </div>
    
    <div id="status-msg">Готов к игре.</div>
</div>

<!-- ИГРОВОЙ ИНТЕРФЕЙС -->
<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="game-ui">
    <div class="stat-line">Режим: <span id="ui-mode" class="highlight">SINGLE</span></div>
    <div class="stat-line">Комната: <span id="ui-room-id" class="highlight">--</span></div>
    <div class="stat-line">Онлайн: <span id="ui-count" class="highlight">1</span></div>
    <div class="stat-line" style="color:#aa00ff;">XP: <span id="ui-xp">0</span></div>
    <div class="stat-line" style="color:#f00;">HP: <span id="ui-hp">100</span>%</div>
    
    <button id="btn-copy-link" class="btn-success" style="pointer-events:auto; margin-top:10px; font-size:12px; padding:8px 15px; width: 100%;">
        📋 Копировать ссылку
    </button>
    
    <button id="btn-leave" class="btn-danger" style="pointer-events:auto; margin-top:5px; font-size:10px; padding:5px 10px; width: 100%;">
        ВЫЙТИ В МЕНЮ
    </button>
</div>

<div id="hint">Управление: WASD / Стрелки. Мышь направляет свет.</div>

<script>
// --- КОНФИГУРАЦИЯ ---
const CANVAS_W = 800;
const CANVAS_H = 600;
const TILE_SIZE = 40;
const PLAYER_RADIUS = 12;
const MONSTER_RADIUS = 15;
const BASE_SPEED = 150; // Пикселей в секунду
const SYNC_INTERVAL_MS = 50;
const INTERPOLATION_FACTOR = 0.15;
const LIGHT_DISTANCE = 350; 

// Карта 40x30
const MAP_COLS = 40;
const MAP_ROWS = 30;
let MAP = [];

function generateMap() {
    MAP = Array(MAP_ROWS).fill().map(() => Array(MAP_COLS).fill(0));
    for(let i=0; i<MAP_COLS; i++) { MAP[0][i] = 1; MAP[MAP_ROWS-1][i] = 1; }
    for(let i=0; i<MAP_ROWS; i++) { MAP[i][0] = 1; MAP[i][MAP_COLS-1] = 1; }

    // Простой генератор стен
    for(let r=2; r<MAP_ROWS-2; r+=2) {
        for(let c=2; c<MAP_COLS-2; c+=2) {
            if(Math.random() > 0.6) {
                let len = Math.floor(Math.random() * 3) + 1;
                for(let k=0; k<len && r+k < MAP_ROWS-1; k++) MAP[r+k][c] = 1;
            }
            if(Math.random() > 0.6) {
                let len = Math.floor(Math.random() * 3) + 1;
                for(let k=0; k<len && c+k < MAP_COLS-1; k++) MAP[r][c+k] = 1;
            }
        }
    }
}
generateMap();

// --- СОСТОЯНИЕ ---
let myId = sessionStorage.getItem('mp_player_id') || ('p_' + Math.random().toString(36).substr(2, 6));
sessionStorage.setItem('mp_player_id', myId);

let myNickname = localStorage.getItem('mp_nickname') || 'Survivor' + Math.floor(Math.random() * 100);

let currentRoomId = null;
let inGame = false;
let isMultiplayerActive = false; // Флаг: реально ли работает сеть?

let myPlayer = { x: 100, y: 100, xp: 0, hp: 100, color: '#ffffcc', name: myNickname };
let otherPlayers = {}; 
let monsters = []; 
let localOrbs = []; 
let keys = {};
let mousePos = { x: 0, y: 0 };
let lastSyncTime = 0;
let unsubscribeRoom = null;
let unsubscribeOrbs = null;
let orbSpawnInterval = null;
let monsterSpawnInterval = null;
let lastFrameTime = performance.now();

// DOM Elements
const els = {
    menu: document.getElementById('menu-screen'),
    canvas: document.getElementById('gameCanvas'),
    ui: document.getElementById('game-ui'),
    hint: document.getElementById('hint'),
    status: document.getElementById('status-msg'),
    joinInput: document.getElementById('join-input'),
    nicknameInput: document.getElementById('nickname-input'),
    btnCreate: document.getElementById('btn-create-multi'),
    btnJoin: document.getElementById('btn-join'),
    btnLeave: document.getElementById('btn-leave'),
    btnCopyLink: document.getElementById('btn-copy-link'),
    btnPlaySingle: document.getElementById('btn-play-single'),
    roomIdDisplay: document.getElementById('ui-room-id'),
    countDisplay: document.getElementById('ui-count'),
    xpDisplay: document.getElementById('ui-xp'),
    hpDisplay: document.getElementById('ui-hp'),
    modeDisplay: document.getElementById('ui-mode'),
    customCursor: document.getElementById('custom-cursor'),
    netStatus: document.getElementById('net-status')
};

let ctx = els.canvas.getContext('2d');

els.nicknameInput.value = myNickname;
els.nicknameInput.addEventListener('change', (e) => {
    myNickname = e.target.value.trim() || 'Guest';
    myPlayer.name = myNickname;
    localStorage.setItem('mp_nickname', myNickname);
});

// --- АВТОМАТИЧЕСКОЕ ПОДКЛЮЧЕНИЕ ---
window.addEventListener('load', () => {
    setTimeout(() => {
        if (!window.FB_DB) {
            setStatus("⚠️ Firebase не загружен. Только Offline.");
            els.btnCreate.disabled = true;
            els.btnJoin.disabled = true;
        } else {
            setStatus("✅ Онлайн активен.");
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        
        if (roomParam && window.FB_DB) {
            startMultiplayerSession(roomParam.toUpperCase());
        }
    }, 1000);
});

// --- ВВОД ---
window.addEventListener('keydown', e => {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('mousemove', (e) => {
    const rect = els.canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
    els.customCursor.style.left = e.clientX + 'px';
    els.customCursor.style.top = e.clientY + 'px';
});

// --- ФУНКЦИИ КОПИРОВАНИЯ ---
function generateInviteUrl() {
    if (!currentRoomId) return "";
    const baseUrl = window.location.origin + window.location.pathname;
    return `${baseUrl}?room=${currentRoomId}`;
}

async function copyToClipboard(text) {
    try { await navigator.clipboard.writeText(text); alert("Ссылка скопирована!"); } catch (err) { alert("Ошибка копирования."); }
}
els.btnCopyLink.onclick = () => { 
    const link = generateInviteUrl(); 
    if(link) copyToClipboard(link); 
    else alert("Вы не в комнате!"); 
};

// --- ЛОГИКА ЗАПУСКА ИГРЫ ---

// 1. SINGLE PLAYER
els.btnPlaySingle.onclick = () => {
    isMultiplayerActive = false;
    currentRoomId = null;
    startGameCore();
};

// 2. MULTIPLAYER CREATE (РОБУСТНЫЙ ВАРИАНТ)
els.btnCreate.onclick = async () => {
    if (!window.FB_DB) return showError("Firebase не загружен");
    
    myNickname = els.nicknameInput.value.trim() || 'Host';
    myPlayer.name = myNickname;
    localStorage.setItem('mp_nickname', myNickname);
    
    setStatus("Создание комнаты...");
    
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let roomId = '';
    for(let i=0; i<6; i++) roomId += chars.charAt(Math.floor(Math.random() * chars.length));
    
    // Запускаем игру СРАЗУ, чтобы пользователь увидел интерфейс
    isMultiplayerActive = true; // Предполагаем успех
    currentRoomId = roomId;
    startGameCore();

    // Теперь пробуем создать комнату в базе. Если упадет - переключимся на Single Mode внутри игры
    try {
        await window.FB_FUNCS.setDoc(window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", roomId), {
            createdAt: window.FB_FUNCS.serverTimestamp(), hostId: myId, status: "open"
        });
        
        // Успех! Регистрируем себя и слушаем других
        registerSelfInRoom();
        listenToPlayersInRoom();
        listenToOrbsInRoom();
        
        setNetStatus("ONLINE", "ok");
        
    } catch (e) {
        console.error("Create Room Failed:", e);
        // Ошибка! Переключаемся в режим "Solo with Fake Multiplayer UI"
        isMultiplayerActive = false;
        setNetStatus("ERROR: SOLO MODE", "bad");
        showError("Не удалось создать комнату. Играете в одиночку.");
    }
};

// 3. JOIN ROOM
els.btnJoin.onclick = () => {
    const val = els.joinInput.value.trim().toUpperCase();
    if (!val) return showError("Введите ID");
    if (!window.FB_DB) return showError("Firebase не загружен");
    
    myNickname = els.nicknameInput.value.trim() || 'Guest';
    myPlayer.name = myNickname;
    localStorage.setItem('mp_nickname', myNickname);
    
    isMultiplayerActive = true;
    currentRoomId = val;
    startGameCore();

    // Пробуем подключиться
    registerSelfInRoom().then(() => {
        listenToPlayersInRoom();
        listenToOrbsInRoom();
        setNetStatus("CONNECTED", "ok");
    }).catch(err => {
        console.error("Join Failed:", err);
        isMultiplayerActive = false;
        setNetStatus("JOIN FAILED: SOLO", "bad");
        showError("Не удалось войти. Играете в одиночку.");
    });
};

// ОБЩИЙ ДВИЖОК ИГРЫ
function startGameCore() {
    history.replaceState(null, "", currentRoomId ? `?room=${currentRoomId}` : window.location.pathname);
    
    // Сброс состояния
    otherPlayers = {};
    localOrbs = [];
    monsters = [];
    myPlayer.x = 100; myPlayer.y = 100; myPlayer.hp = 100; myPlayer.xp = 0;
    
    inGame = true;
    els.menu.style.display = 'none';
    els.canvas.style.display = 'block';
    els.ui.style.display = 'block';
    els.hint.style.display = 'block';
    els.customCursor.style.display = 'block';
    els.netStatus.style.display = 'block';
    
    els.modeDisplay.textContent = isMultiplayerActive ? "MULTIPLAYER" : "SINGLE PLAYER";
    els.roomIdDisplay.textContent = currentRoomId || "--";
    els.countDisplay.textContent = "1";
    
    spawnMonstersInitial();
    
    lastFrameTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function setNetStatus(msg, type) {
    els.netStatus.textContent = msg;
    els.netStatus.className = "";
    if(type === 'ok') els.netStatus.classList.add('net-ok');
    else if(type === 'warn') els.netStatus.classList.add('net-warn');
    else els.netStatus.classList.add('net-bad');
}

async function registerSelfInRoom() {
    if (!window.FB_DB || !currentRoomId) return;
    const ref = window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", currentRoomId, "players", myId);
    await window.FB_FUNCS.setDoc(ref, {
        x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, name: myPlayer.name, timestamp: window.FB_FUNCS.serverTimestamp()
    });
}

function listenToPlayersInRoom() {
    if(!isMultiplayerActive) return;
    const colRef = window.FB_FUNCS.collection(window.FB_DB, "test_lobbies", currentRoomId, "players");
    unsubscribeRoom = window.FB_FUNCS.onSnapshot(colRef, (snapshot) => {
        const currentOtherPlayers = {};
        snapshot.forEach(docChange => {
            const data = docChange.data();
            const playerId = docChange.id;
            if (playerId === myId) return;
            currentOtherPlayers[playerId] = {
                x: data.x, y: data.y, targetX: data.x, targetY: data.y,
                color: data.color || '#ffffff', name: data.name || "Unknown"
            };
            if (otherPlayers[playerId]) {
                 currentOtherPlayers[playerId].x = otherPlayers[playerId].x;
                 currentOtherPlayers[playerId].y = otherPlayers[playerId].y;
            }
        });
        otherPlayers = currentOtherPlayers;
        els.countDisplay.textContent = Object.keys(otherPlayers).length + 1;
    }, (err) => {
        console.error("Net Err:", err);
        isMultiplayerActive = false; 
        els.modeDisplay.textContent = "SINGLE (NET ERR)";
        setNetStatus("DISCONNECTED", "bad");
    });
}

function listenToOrbsInRoom() {
    if(!isMultiplayerActive) return;
    const colRef = window.FB_FUNCS.collection(window.FB_DB, "test_lobbies", currentRoomId, "orbs");
    unsubscribeOrbs = window.FB_FUNCS.onSnapshot(colRef, (snap) => {
        localOrbs = [];
        snap.forEach(doc => {
            const d = doc.data();
            localOrbs.push({ id: doc.id, x: d.x, y: d.y });
        });
    }, (err) => console.warn("Orbs Err:", err));

    if(orbSpawnInterval) clearInterval(orbSpawnInterval);
    orbSpawnInterval = setInterval(async () => {
        if (!inGame || !window.FB_DB || !isMultiplayerActive) return;
        if (localOrbs.length < 10) {
            const rx = 50 + Math.random() * (MAP_COLS * TILE_SIZE - 100);
            const ry = 50 + Math.random() * (MAP_ROWS * TILE_SIZE - 100);
            const tileX = Math.floor(rx / TILE_SIZE);
            const tileY = Math.floor(ry / TILE_SIZE);
            if (MAP[tileY] && MAP[tileY][tileX] === 0) {
                try { await window.FB_FUNCS.addDoc(colRef, { x: rx, y: ry }); } catch(e) {}
            }
        }
    }, 3000);
}

function spawnMonstersInitial() {
    for(let i=0; i<5; i++) spawnMonster();
    if(monsterSpawnInterval) clearInterval(monsterSpawnInterval);
    monsterSpawnInterval = setInterval(spawnMonster, 5000);
}

function spawnMonster() {
    if(!inGame) return;
    let attempts = 0;
    while(attempts < 10) {
        const rx = 50 + Math.random() * (MAP_COLS * TILE_SIZE - 100);
        const ry = 50 + Math.random() * (MAP_ROWS * TILE_SIZE - 100);
        const tileX = Math.floor(rx / TILE_SIZE);
        const tileY = Math.floor(ry / TILE_SIZE);
        const distToPlayer = Math.hypot(myPlayer.x - rx, myPlayer.y - ry);
        if(distToPlayer > 300 && MAP[tileY] && MAP[tileY][tileX] === 0) {
            monsters.push({ x: rx, y: ry, speed: 40 });
            return;
        }
        attempts++;
    }
}

async function syncPosition() {
    if (!inGame || !isMultiplayerActive || !window.FB_DB) return;
    const now = Date.now();
    if (now - lastSyncTime < SYNC_INTERVAL_MS) return;
    lastSyncTime = now;
    const ref = window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", currentRoomId, "players", myId);
    await window.FB_FUNCS.updateDoc(ref, {
        x: myPlayer.x, y: myPlayer.y, name: myPlayer.name, timestamp: window.FB_FUNCS.serverTimestamp()
    }).catch(e => { /* ignore */ });
}

async function collectOrb(id) {
    if (!inGame) return;
    if (isMultiplayerActive && window.FB_DB) {
        const ref = window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", currentRoomId, "orbs", id);
        await window.FB_FUNCS.deleteDoc(ref).catch(e => {});
    }
    myPlayer.xp += 10;
    updateUI();
}

function takeDamage(amount) {
    myPlayer.hp -= amount;
    if(myPlayer.hp <= 0) {
        myPlayer.hp = 0;
        gameOver();
    }
    updateUI();
}

function gameOver() {
    inGame = false;
    alert("GAME OVER! HP: 0");
    leaveRoom();
}

function leaveRoom() {
    inGame = false;
    if (unsubscribeRoom) unsubscribeRoom();
    if (unsubscribeOrbs) unsubscribeOrbs();
    if (orbSpawnInterval) clearInterval(orbSpawnInterval);
    if (monsterSpawnInterval) clearInterval(monsterSpawnInterval);
    
    if (isMultiplayerActive && window.FB_DB && currentRoomId) {
        const ref = window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", currentRoomId, "players", myId);
        window.FB_FUNCS.deleteDoc(ref).catch(()=>{});
    }

    history.replaceState(null, "", window.location.pathname);
    els.menu.style.display = 'block';
    els.canvas.style.display = 'none';
    els.ui.style.display = 'none';
    els.hint.style.display = 'none';
    els.customCursor.style.display = 'none';
    els.netStatus.style.display = 'none';
    setStatus("");
}

// --- ФИЗИКА И РЕНДЕР ---

function isWall(x, y) {
    const tx = Math.floor(x / TILE_SIZE);
    const ty = Math.floor(y / TILE_SIZE);
    if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) return true;
    return MAP[ty][tx] === 1;
}

function checkCollision(px, py, radius) {
    const corners = [
        {x: px - radius, y: py - radius},
        {x: px + radius, y: py - radius},
        {x: px - radius, y: py + radius},
        {x: px + radius, y: py + radius}
    ];
    for (let c of corners) {
        if (isWall(c.x, c.y)) return true;
    }
    return false;
}

function updatePhysics(dt) {
    if (!inGame) return;

    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const length = Math.sqrt(dx*dx + dy*dy);
        dx /= length;
        dy /= length;
        
        const moveSpeed = BASE_SPEED * dt; 
        
        let nextX = myPlayer.x + dx * moveSpeed;
        if (!checkCollision(nextX, myPlayer.y, PLAYER_RADIUS)) myPlayer.x = nextX;

        let nextY = myPlayer.y + dy * moveSpeed;
        if (!checkCollision(myPlayer.x, nextY, PLAYER_RADIUS)) myPlayer.y = nextY;
    }

    // Интерполяция других игроков
    for (let pid in otherPlayers) {
        const p = otherPlayers[pid];
        p.x += (p.targetX - p.x) * INTERPOLATION_FACTOR;
        p.y += (p.targetY - p.y) * INTERPOLATION_FACTOR;
    }

    // Сбор орбов
    for (let i = localOrbs.length - 1; i >= 0; i--) {
        const orb = localOrbs[i];
        const dist = Math.hypot(myPlayer.x - orb.x, myPlayer.y - orb.y);
        if (dist < PLAYER_RADIUS + 10) {
            collectOrb(orb.id);
        }
    }

    // Монстры
    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        const distToPlayer = Math.hypot(m.x - myPlayer.x, m.y - myPlayer.y);
        
        if (distToPlayer < 500) {
            const angle = Math.atan2(myPlayer.y - m.y, myPlayer.x - m.x);
            const moveSpeed = m.speed * dt;
            let nextMx = m.x + Math.cos(angle) * moveSpeed;
            let nextMy = m.y + Math.sin(angle) * moveSpeed;
            
            if (!checkCollision(nextMx, nextMy, MONSTER_RADIUS)) {
                m.x = nextMx;
                m.y = nextMy;
            } else {
                if (!checkCollision(nextMx, m.y, MONSTER_RADIUS)) m.x = nextMx;
                else if (!checkCollision(m.x, nextMy, MONSTER_RADIUS)) m.y = nextMy;
            }
        }

        if (distToPlayer < PLAYER_RADIUS + MONSTER_RADIUS) {
            takeDamage(10);
            m.x -= Math.cos(Math.atan2(myPlayer.y - m.y, myPlayer.x - m.x)) * 20;
            m.y -= Math.sin(Math.atan2(myPlayer.y - m.y, myPlayer.x - m.x)) * 20;
        }
    }
}

function drawLighting(ctx) {
    ctx.save();
    const gradient = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, 0, CANVAS_W/2, CANVAS_H/2, LIGHT_DISTANCE);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
    gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.restore();
}

function drawWorld(ctx, cameraX, cameraY) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    
    const startCol = Math.floor(cameraX / TILE_SIZE);
    const endCol = startCol + (CANVAS_W / TILE_SIZE) + 1;
    const startRow = Math.floor(cameraY / TILE_SIZE);
    const endRow = startRow + (CANVAS_H / TILE_SIZE) + 1;
    
    for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
                const x = c * TILE_SIZE - cameraX;
                const y = r * TILE_SIZE - cameraY;
                
                if (MAP[r][c] === 1) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                } else {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }
        }
    }
}

function drawEntities(ctx, cameraX, cameraY) {
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#aa00ff';
    for (let orb of localOrbs) {
        const sx = orb.x - cameraX;
        const sy = orb.y - cameraY;
        if(sx > -20 && sx < CANVAS_W+20 && sy > -20 && sy < CANVAS_H+20) {
            ctx.beginPath();
            ctx.arc(sx, sy, 5, 0, Math.PI*2);
            ctx.fill();
        }
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#500';
    for (let m of monsters) {
        const sx = m.x - cameraX;
        const sy = m.y - cameraY;
        if(sx > -30 && sx < CANVAS_W+30 && sy > -30 && sy < CANVAS_H+30) {
            ctx.beginPath();
            ctx.arc(sx, sy, MONSTER_RADIUS, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.arc(sx - 5, sy - 2, 2, 0, Math.PI*2);
            ctx.arc(sx + 5, sy - 2, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#500';
        }
    }

    for (let pid in otherPlayers) {
        const p = otherPlayers[pid];
        const sx = p.x - cameraX;
        const sy = p.y - cameraY;
        if(sx > -20 && sx < CANVAS_W+20 && sy > -20 && sy < CANVAS_H+20) {
            drawPlayerSprite(ctx, sx, sy, p.color, p.name);
        }
    }

    drawPlayerSprite(ctx, CANVAS_W/2, CANVAS_H/2, myPlayer.color, myPlayer.name, true);
}

function drawPlayerSprite(ctx, x, y, color, label, isMe = false) {
    ctx.beginPath();
    ctx.arc(x, y, PLAYER_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = isMe ? '#fff' : '#000';
    ctx.stroke();
    
    if(isMe) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x, y, PLAYER_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, y - 20);
}

function render() {
    if (!inGame || !ctx) return;
    
    const cameraX = myPlayer.x - CANVAS_W / 2;
    const cameraY = myPlayer.y - CANVAS_H / 2;
    
    drawWorld(ctx, cameraX, cameraY);
    drawEntities(ctx, cameraX, cameraY);
    drawLighting(ctx);
}

function updateUI() {
    els.xpDisplay.textContent = myPlayer.xp;
    els.hpDisplay.textContent = myPlayer.hp;
    els.hpDisplay.style.color = myPlayer.hp < 30 ? '#f00' : '#fff';
}

function gameLoop(currentTime) {
    if (!inGame) return;
    
    const deltaTime = (currentTime - lastFrameTime) / 1000;
    lastFrameTime = currentTime;
    const safeDt = Math.min(deltaTime, 0.1); 
    
    updatePhysics(safeDt);
    syncPosition();
    render();
    
    requestAnimationFrame(gameLoop);
}

// --- ОБРАБОТЧИКИ КНОПОК ---
els.btnLeave.onclick = leaveRoom;

function setStatus(msg) { els.status.textContent = msg; }
function showError(msg) { 
    els.status.textContent = msg; 
    els.status.style.color = "#f44"; 
    setTimeout(() => els.status.style.color = "#aaa", 3000); 
}

window.addEventListener('beforeunload', () => {
    if (inGame && isMultiplayerActive && window.FB_DB && currentRoomId) {
        const ref = window.FB_FUNCS.doc(window.FB_DB, "test_lobbies", currentRoomId, "players", myId);
        window.FB_FUNCS.deleteDoc(ref);
    }
});

</script>
