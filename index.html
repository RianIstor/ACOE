<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergey's NetPlay - Firestore Edition</title>
    
    <!-- Стили остаются теми же -->
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --card-bg: #2a2a2a;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff4444;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            padding: 24px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
        
        .screen { display: none; animation: fadeIn 0.3s; flex-grow: 1; overflow-y: auto; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        input[type="text"] {
            width: 100%; padding: 12px; background: #1f1f1f; border: 1px solid #444;
            border-radius: 8px; color: white; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #00ddbb; }
        .btn-secondary { background: #444; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* Rooms List */
        .room-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 8px;
            padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .room-host { font-weight: bold; }
        .room-code { font-family: monospace; color: var(--accent); font-size: 1.2rem; }
        
        /* Lobby */
        .player-item {
            display: flex; justify-content: space-between; padding: 10px;
            background: #252525; margin-bottom: 5px; border-radius: 6px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: green; display: inline-block; margin-right: 5px; }
        
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: white; padding: 10px 20px;
            border-radius: 20px; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        #toast.show { opacity: 1; }

        canvas { width: 100%; height: 300px; background: #000; border-radius: 8px; margin-top: 10px; display: block;}
        .loading-spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,.3); border-radius: 50%;
            border-top-color: var(--accent); animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- 1. Меню -->
    <div id="menu-screen" class="screen active">
        <h1>NetPlay Online</h1>
        <div class="input-group">
            <label>Ваш никнейм:</label>
            <input type="text" id="nickname" placeholder="Игрок_1">
        </div>
        <button class="btn-primary" onclick="gameApp.createRoom()">Создать комнату</button>
        <button class="btn-outline" onclick="gameApp.loadRooms()">Найти активные игры</button>
        <div id="network-status" style="text-align:center; margin-top:15px; font-size:0.8rem; color:var(--text-muted);">
            Статус: <span id="conn-status">Готов</span>
        </div>
    </div>

    <!-- 2. Список комнат -->
    <div id="discover-screen" class="screen">
        <h1>Активные комнаты</h1>
        <ul id="rooms-list" style="list-style:none;"></ul>
        <button class="btn-secondary" onclick="gameApp.backToMenu()">Назад</button>
    </div>

    <!-- 3. Лобби -->
    <div id="lobby-screen" class="screen">
        <h1>Лобби</h1>
        <div style="background:#1f1f1f; padding:15px; border-radius:8px; text-align:center; margin-bottom:15px;">
            <p style="color:var(--text-muted)">Код комнаты:</p>
            <div id="display-room-code" style="font-size:1.8rem; font-family:monospace; color:var(--accent);">------</div>
            <p style="font-size:0.8rem; color:var(--text-muted)">Отправьте этот код другу!</p>
        </div>
        
        <label>Игроки (<span id="player-count">1</span>):</label>
        <ul id="players-list" style="list-style:none; margin-top:10px;"></ul>

        <button class="btn-primary" id="start-game-btn" onclick="gameApp.startGame()" disabled>Начать игру</button>
        <button class="btn-danger" onclick="gameApp.leaveRoom()">Выйти</button>
    </div>

    <!-- 4. Игра -->
    <div id="game-screen" class="screen">
        <h1>Игра запущена</h1>
        <canvas id="game-canvas"></canvas>
        <button class="btn-secondary" onclick="gameApp.returnToLobby()">Вернуться</button>
    </div>

</div>

<div id="toast"></div>

<!-- ИСПОЛЬЗУЕМ TYPE MODULE ДЛЯ FIREBASE V9+ -->
<script type="module">
    // 1. Импорт необходимых функций из Firebase SDK (через CDN gstatic)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        doc, 
        updateDoc, 
        deleteDoc,
        onSnapshot, 
        query, 
        where, 
        orderBy, 
        limit,
        serverTimestamp,
        runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 2. Твой Конфигурационный объект (уже заполнен данными Сергея)
    const firebaseConfig = {
        apiKey: "AIzaSyDVV5jIHsH4CS1_utz1thzgJ2c04kxV7AM",
        authDomain: "sergey-game.firebaseapp.com",
        projectId: "sergey-game",
        storageBucket: "sergey-game.firebasestorage.app",
        messagingSenderId: "141202017103",
        appId: "1:141202017103:web:3ef11cdf6b7fa057a6533a",
        measurementId: "G-9YEXXVK29W"
    };

    // 3. Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /**
     * Класс сервиса сети
     */
    class NetworkService {
        constructor() {
            this.db = db;
            this.unsubscribers = [];
        }

        async createRoom(hostNickname) {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            try {
                const docRef = await addDoc(collection(this.db, "rooms"), {
                    code: code,
                    hostName: hostNickname,
                    createdAt: serverTimestamp(),
                    players: [{ id: crypto.randomUUID(), nickname: hostNickname, isHost: true, x: 50, y: 50 }],
                    status: "waiting",
                    lastUpdate: serverTimestamp()
                });
                return { code, roomId: docRef.id };
            } catch (error) {
                console.error("Create room error:", error);
                throw error;
            }
        }

        subscribeToRooms(callback) {
            const q = query(
                collection(this.db, "rooms"),
                where("status", "==", "waiting"),
                orderBy("createdAt", "desc"),
                limit(10)
            );
            
            const unsub = onSnapshot(q, (snapshot) => {
                const rooms = [];
                snapshot.forEach(doc => {
                    rooms.push({ id: doc.id, ...doc.data() });
                });
                callback(rooms);
            }, (error) => {
                console.error("Listen rooms error:", error);
            });
            
            this.unsubscribers.push(unsub);
            return unsub;
        }

        joinRoom(roomId, playerNickname) {
            return new Promise((resolve, reject) => {
                const roomRef = doc(this.db, "rooms", roomId);
                
                runTransaction(this.db, async (transaction) => {
                    const docSnap = await transaction.get(roomRef);
                    if (!docSnap.exists()) throw new Error("Комната не найдена");
                    
                    const data = docSnap.data();
                    if (data.status !== "waiting") throw new Error("Игра началась");
                    if (data.players.length >= 4) throw new Error("Полно");

                    const newPlayer = { 
                        id: crypto.randomUUID(), 
                        nickname: playerNickname, 
                        isHost: false,
                        x: 100 + Math.random()*50, 
                        y: 100 + Math.random()*50 
                    };

                    transaction.update(roomRef, {
                        players: [...data.players, newPlayer],
                        lastUpdate: serverTimestamp()
                    });
                }).then(() => resolve()).catch(reject);
            });
        }

        listenToRoomUpdates(roomId, onUpdate, onError) {
            const roomRef = doc(this.db, "rooms", roomId);
            const unsub = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    onUpdate(docSnap.data());
                } else {
                    onError(new Error("Комната удалена"));
                }
            }, onError);
            this.unsubscribers.push(unsub);
            return unsub;
        }

        startGame(roomId) {
            return updateDoc(doc(this.db, "rooms", roomId), {
                status: "playing",
                startedAt: serverTimestamp()
            });
        }

        leaveRoom(roomId, playerId) {
            return runTransaction(this.db, async (transaction) => {
                const ref = doc(this.db, "rooms", roomId);
                const docSnap = await transaction.get(ref);
                if (!docSnap.exists()) return;
                
                const data = docSnap.data();
                const updatedPlayers = data.players.filter(p => p.id !== playerId);
                
                if (updatedPlayers.length === 0) {
                    transaction.delete(ref);
                } else {
                    transaction.update(ref, { players: updatedPlayers, lastUpdate: serverTimestamp() });
                }
            });
        }

        // Обновление позиции игрока в реальном времени
        updatePosition(roomId, playerId, newX, newY) {
            // Оптимизация: отправляем только если позиция изменилась значительно или раз в N мс
            // Здесь для простоты делаем прямой апдейт. В проде лучше throttle.
            const roomRef = doc(this.db, "rooms", roomId);
            // Firestore не позволяет легко обновить элемент внутри массива без чтения всей структуры.
            // Поэтому мы читаем, модифицируем и пишем обратно.
            // ВАЖНО: Это дорого по операциям. Для демо с 2 игроками ок.
            
            return runTransaction(this.db, async (transaction) => {
                const docSnap = await transaction.get(roomRef);
                if (!docSnap.exists()) return;
                
                const data = docSnap.data();
                const playersIndex = data.players.findIndex(p => p.id === playerId);
                if (playersIndex === -1) return;

                const newPlayers = [...data.players];
                newPlayers[playersIndex] = { ...newPlayers[playersIndex], x: newX, y: newY };

                transaction.update(roomRef, { 
                    players: newPlayers,
                    lastUpdate: serverTimestamp() 
                });
            });
        }

        cleanup() {
            this.unsubscribers.forEach(fn => fn());
            this.unsubscribers = [];
        }
    }

    /**
     * Логика приложения
     */
    class GameApplication {
        constructor() {
            this.net = new NetworkService();
            this.playerId = crypto.randomUUID();
            this.nickname = '';
            this.currentRoomId = null;
            this.currentRoomCode = null;
            this.isHost = false;
            this.players = [];
            this.gameStateUnsub = null;
            this.roomsListUnsub = null;
            this.lastPosSendTime = 0;

            this.screens = {
                menu: document.getElementById('menu-screen'),
                discover: document.getElementById('discover-screen'),
                lobby: document.getElementById('lobby-screen'),
                game: document.getElementById('game-screen')
            };
            
            this.ui = {
                nicknameInput: document.getElementById('nickname'),
                roomsList: document.getElementById('rooms-list'),
                roomCodeDisplay: document.getElementById('display-room-code'),
                playersList: document.getElementById('players-list'),
                playerCount: document.getElementById('player-count'),
                startBtn: document.getElementById('start-game-btn'),
                toast: document.getElementById('toast'),
                connStatus: document.getElementById('conn-status')
            };

            this.bindEvents();
            this.ui.nicknameInput.value = `Player_${Math.floor(Math.random() * 1000)}`;
        }

        bindEvents() {}

        showToast(msg) {
            this.ui.toast.textContent = msg;
            this.ui.toast.classList.add('show');
            setTimeout(() => this.ui.toast.classList.remove('show'), 3000);
        }

        switchScreen(screenName) {
            Object.values(this.screens).forEach(el => el.classList.remove('active'));
            this.screens[screenName].classList.add('active');
        }

        setStatus(text) {
            this.ui.connStatus.textContent = text;
        }

        async createRoom() {
            this.nickname = this.ui.nicknameInput.value.trim() || "Host";
            this.setStatus("Создание комнаты...");
            
            try {
                const result = await this.net.createRoom(this.nickname);
                this.currentRoomId = result.roomId;
                this.currentRoomCode = result.code;
                this.isHost = true;
                
                // Подписываемся на обновления своей комнаты
                this.listenToMyRoom();
                
                this.enterLobby();
                this.setStatus("Комната готова");
            } catch (err) {
                this.setStatus("Ошибка");
                alert("Не удалось создать комнату: " + err.message);
            }
        }

        loadRooms() {
            this.switchScreen('discover');
            this.ui.roomsList.innerHTML = '<li style="padding:10px; color:gray">Загрузка...</li>';
            
            // Отменяем старые подписки на список комнат
            if (this.roomsListUnsub) this.roomsListUnsub();

            this.roomsListUnsub = this.net.subscribeToRooms((rooms) => {
                this.renderRoomsList(rooms);
            });
        }

        backToMenu() {
            if (this.roomsListUnsub) this.roomsListUnsub();
            this.switchScreen('menu');
        }

        renderRoomsList(rooms) {
            this.ui.roomsList.innerHTML = '';
            if (rooms.length === 0) {
                this.ui.roomsList.innerHTML = '<li style="padding:10px; color:gray">Нет активных игр.</li>';
                return;
            }

            rooms.forEach(room => {
                const li = document.createElement('li');
                li.className = 'room-card';
                li.innerHTML = `
                    <div>
                        <div class="room-host">${room.hostName}</div>
                        <div class="room-code">#${room.code}</div>
                    </div>
                    <button class="btn-primary" style="width:auto; padding:8px 12px;" 
                            onclick="window.gameApp.joinSpecificRoom('${room.id}', '${room.code}')">
                        Войти
                    </button>
                `;
                this.ui.roomsList.appendChild(li);
            });
        }

        async joinSpecificRoom(roomId, code) {
            this.nickname = this.ui.nicknameInput.value.trim() || "Guest";
            this.setStatus("Подключение...");
            
            try {
                await this.net.joinRoom(roomId, this.nickname);
                this.currentRoomId = roomId;
                this.currentRoomCode = code;
                this.isHost = false;
                
                this.listenToMyRoom();
                this.enterLobby();
                this.setStatus("Подключено");
            } catch (err) {
                this.setStatus("Ошибка");
                alert("Не удалось войти: " + err.message);
            }
        }

        listenToMyRoom() {
            if (this.gameStateUnsub) this.gameStateUnsub();
            
            this.gameStateUnsub = this.net.listenToRoomUpdates(
                this.currentRoomId,
                (data) => {
                    this.players = data.players;
                    this.updateLobbyUI();
                    
                    // Если статус стал playing, запускаем игру
                    if (data.status === "playing" && !this.inGameLoop) {
                        this.startGameLoop();
                    }
                },
                (err) => {
                    console.error(err);
                    this.showToast("Комната закрыта");
                    this.leaveRoom(true); // Принудительный выход
                }
            );
        }

        enterLobby() {
            this.ui.roomCodeDisplay.textContent = this.currentRoomCode;
            this.updateLobbyUI();
            this.switchScreen('lobby');
        }

        updateLobbyUI() {
            this.ui.playersList.innerHTML = '';
            this.players.forEach(player => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.innerHTML = `
                    <span>${player.nickname} ${player.isHost ? '(Хост)' : ''}</span>
                    <span><span class="status-dot"></span></span>
                `;
                this.ui.playersList.appendChild(li);
            });
            
            this.ui.playerCount.textContent = this.players.length;

            const canStart = this.isHost && this.players.length >= 2;
            this.ui.startBtn.disabled = !canStart;
            this.ui.startBtn.style.opacity = canStart ? 1 : 0.5;
        }

        async startGame() {
            if (!this.isHost) return;
            await this.net.startGame(this.currentRoomId);
            // Остальные получат обновление через listener и сами начнут игру
        }

        startGameLoop() {
            if (this.inGameLoop) return;
            this.inGameLoop = true;
            this.switchScreen('game');
            this.initCanvas();
        }

        returnToLobby() {
            this.stopGameLoop();
            this.switchScreen('lobby');
            this.updateLobbyUI();
        }

        stopGameLoop() {
            this.inGameLoop = false;
            cancelAnimationFrame(this.gameLoopId);
        }

        leaveRoom(silent = false) {
            if (!silent) {
                this.net.leaveRoom(this.currentRoomId, this.playerId);
            }
            this.cleanup();
            this.resetGame();
            this.switchScreen('menu');
            if (!silent) this.showToast("Вы вышли из комнаты");
        }

        resetGame() {
            this.currentRoomId = null;
            this.currentRoomCode = null;
            this.isHost = false;
            this.players = [];
            this.stopGameLoop();
        }

        cleanup() {
            this.net.cleanup();
            if (this.gameStateUnsub) this.gameStateUnsub();
            if (this.roomsListUnsub) this.roomsListUnsub();
        }

        // --- Canvas Logic ---
        initCanvas() {
            const canvas = document.getElementById('game-canvas');
            this.canvasCtx = canvas.getContext('2d');
            
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            this.canvasCtx.scale(dpr, dpr);

            this.loop();
        }

        loop() {
            if (!this.inGameLoop || !this.canvasCtx) return;
            
            const ctx = this.canvasCtx;
            const w = ctx.canvas.clientWidth;
            const h = ctx.canvas.clientHeight;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // Найдем себя в списке игроков
            const me = this.players.find(p => p.id === this.playerId);
            
            if (me) {
                // Движение моего персонажа (упрощенно: автодвижение или стрелки)
                // Для демо сделаем автодвижение, чтобы не писать контроллер ввода сейчас
                me.x += (Math.random() - 0.5) * 2;
                me.y += (Math.random() - 0.5) * 2;

                // Границы
                if (me.x < 20) me.x = 20;
                if (me.x > w - 20) me.x = w - 20;
                if (me.y < 20) me.y = 20;
                if (me.y > h - 20) me.y = h - 20;

                // Отправка позиции в Firestore (Throttled: раз в 100мс)
                const now = Date.now();
                if (now - this.lastPosSendTime > 100) {
                    this.net.updatePosition(this.currentRoomId, this.playerId, me.x, me.y);
                    this.lastPosSendTime = now;
                }
            }

            // Рисуем всех игроков
            this.players.forEach(player => {
                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = player.isHost ? '#00ffcc' : '#ff4444';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Никнейм над головой
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(player.nickname, player.x, player.y - 20);
            });

            this.gameLoopId = requestAnimationFrame(() => this.loop());
        }
    }

    // Экспортируем экземпляр в глобал для вызова из HTML onclick
    window.gameApp = new GameApplication();

</script>
</body>
</html>
