
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Match Game</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
            onSnapshot, query, where, limit, serverTimestamp, runTransaction, getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Твой конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyDVV5jIHsH4CS1_utz1thzgJ2c04kxV7AM",
            authDomain: "sergey-game.firebaseapp.com",
            projectId: "sergey-game",
            storageBucket: "sergey-game.firebasestorage.app",
            messagingSenderId: "141202017103",
            appId: "1:141202017103:web:3ef11cdf6b7fa057a6533a",
            measurementId: "G-9YEXXVK29W"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("✅ Firebase Ready");
        } catch (e) {
            console.error("❌ Error:", e);
        }

        class GameEngine {
            constructor() {
                this.db = db;
                this.playerId = crypto.randomUUID();
                this.roomId = null;
                this.isHost = false;
                this.players = [];
                this.gameStarted = false;
                this.unsub = null;
                
                // Игровые переменные
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.keys = {};
                this.lastSendTime = 0;
                this.loopId = null;

                this.initInput();
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.ctx.scale(dpr, dpr);
                this.w = rect.width;
                this.h = rect.height;
            }

            initInput() {
                window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
                window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
            }

            async play() {
                document.getElementById('ui-menu').style.display = 'none';
                document.getElementById('ui-loading').style.display = 'flex';
                
                try {
                    // 1. Поиск комнаты
                    const q = query(collection(this.db, "rooms"), where("status", "==", "waiting"), limit(1));
                    const snapshot = await getDocs(q);

                    if (!snapshot.empty) {
                        // Нашли! Заходим.
                        const roomDoc = snapshot.docs[0];
                        this.roomId = roomDoc.id;
                        await this.joinRoomInternal(roomDoc.data().players);
                    } else {
                        // Нет комнат. Создаем.
                        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                        const newPlayer = { id: this.playerId, x: this.w/2, y: this.h/2, isHost: true };
                        
                        const docRef = await addDoc(collection(this.db, "rooms"), {
                            code: code,
                            status: "waiting",
                            players: [newPlayer],
                            createdAt: serverTimestamp()
                        });
                        
                        this.roomId = docRef.id;
                        this.isHost = true;
                        this.players = [newPlayer];
                        this.listenToRoom();
                    }
                } catch (err) {
                    alert("Ошибка сети: " + err.message);
                    location.reload();
                }
            }

            async joinRoomInternal(currentPlayers) {
                // Транзакция для безопасного добавления себя
                await runTransaction(this.db, async (transaction) => {
                    const ref = doc(this.db, "rooms", this.roomId);
                    const snap = await transaction.get(ref);
                    
                    if (!snap.exists() || snap.data().status !== "waiting") {
                        throw new Error("Комната занята или закрыта");
                    }

                    const newMe = { 
                        id: this.playerId, 
                        x: Math.random() * this.w, 
                        y: Math.random() * this.h, 
                        isHost: false 
                    };
                    
                    const updatedPlayers = [...snap.data().players, newMe];
                    
                    transaction.update(ref, {
                        players: updatedPlayers,
                        // Если стало 2 игрока - сразу стартуем игру в базе
                        status: updatedPlayers.length >= 2 ? "playing" : "waiting"
                    });
                });

                this.listenToRoom();
            }

            listenToRoom() {
                if (this.unsub) this.unsub();
                
                this.unsub = onSnapshot(doc(this.db, "rooms", this.roomId), (docSnap) => {
                    if (!docSnap.exists()) {
                        alert("Комната удалена");
                        location.reload();
                        return;
                    }
                    
                    const data = docSnap.data();
                    this.players = data.players;
                    
                    // Проверка статуса игры
                    if (data.status === "playing" && !this.gameStarted) {
                        this.startGameLoop();
                    }
                }, (err) => {
                    console.error(err);
                });
            }

            startGameLoop() {
                this.gameStarted = true;
                document.getElementById('ui-loading').style.display = 'none';
                this.canvas.style.display = 'block';
                this.loop();
            }

            loop() {
                if (!this.gameStarted) return;

                const ctx = this.ctx;
                const w = this.w;
                const h = this.h;

                // Очистка
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);

                // Движение моего персонажа
                const me = this.players.find(p => p.id === this.playerId);
                if (me) {
                    const speed = 5;
                    if (this.keys['w'] || this.keys['arrowup']) me.y -= speed;
                    if (this.keys['s'] || this.keys['arrowdown']) me.y += speed;
                    if (this.keys['a'] || this.keys['arrowleft']) me.x -= speed;
                    if (this.keys['d'] || this.keys['arrowright']) me.x += speed;

                    // Границы
                    if (me.x < 20) me.x = 20;
                    if (me.x > w - 20) me.x = w - 20;
                    if (me.y < 20) me.y = 20;
                    if (me.y > h - 20) me.y = h - 20;

                    // Отправка позиции (Throttle 50ms для плавности)
                    const now = Date.now();
                    if (now - this.lastSendTime > 50) {
                        this.updatePosition(me.x, me.y);
                        this.lastSendTime = now;
                    }
                }

                // Рендер всех игроков
                this.players.forEach(p => {
                    ctx.beginPath();
                    ctx.rect(p.x - 15, p.y - 15, 30, 30); // Квадрат
                    
                    // Цвет: Хост белый, Гость красный (или наоборот, для различения)
                    if (p.id === this.playerId) {
                        ctx.fillStyle = '#fff'; // Я всегда белый
                    } else {
                        ctx.fillStyle = '#ff4444'; // Друг красный
                    }
                    
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                });

                this.loopId = requestAnimationFrame(() => this.loop());
            }

            updatePosition(x, y) {
                // Оптимизация: пишем только координаты конкретного игрока внутри массива
                // Firestore не позволяет обновлять элемент массива напрямую без чтения всего массива.
                // Для простоты делаем транзакцию обновления всего массива players.
                runTransaction(this.db, async (transaction) => {
                    const ref = doc(this.db, "rooms", this.roomId);
                    const snap = await transaction.get(ref);
                    if (!snap.exists()) return;
                    
                    const data = snap.data();
                    const idx = data.players.findIndex(p => p.id === this.playerId);
                    if (idx === -1) return;

                    const newPlayers = [...data.players];
                    newPlayers[idx] = { ...newPlayers[idx], x, y };

                    transaction.update(ref, { players: newPlayers });
                }).catch(console.error);
            }
        }

        // Инициализация при загрузке DOM
        window.onload = () => {
            const game = new GameEngine();
            window.gameInstance = game; // Доступ из консоли для отладки
            
            // Привязка кнопки
            document.getElementById('btn-play').onclick = () => game.play();
        };

    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden; /* Убираем скролл */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: none; /* Скрыт до начала игры */
            border: 1px solid #333;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.9);
        }

        #ui-loading {
            display: none;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #00ffcc;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        p {
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Меню -->
    <div id="ui-menu" class="ui-layer">
        <h1>AUTO MATCH</h1>
        <button id="btn-play">ИГРАТЬ</button>
        <p>Нажми, чтобы найти соперника</p>
    </div>

    <!-- Экран загрузки/поиска -->
    <div id="ui-loading" class="ui-layer">
        <div class="loader"></div>
        <p>Поиск игры...</p>
    </div>

    <!-- Игровой холст -->
    <canvas id="game-canvas"></canvas>

</body>
</html>
