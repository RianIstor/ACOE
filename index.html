<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Movement - Infinite World</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
            onSnapshot, query, where, limit, serverTimestamp, runTransaction, getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Твой конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyDVV5jIHsH4CS1_utz1thzgJ2c04kxV7AM",
            authDomain: "sergey-game.firebaseapp.com",
            projectId: "sergey-game",
            storageBucket: "sergey-game.firebasestorage.app",
            messagingSenderId: "141202017103",
            appId: "1:141202017103:web:3ef11cdf6b7fa057a6533a",
            measurementId: "G-9YEXXVK29W"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("✅ Firebase Ready");
        } catch (e) {
            console.error("❌ Error:", e);
        }

        class FixedGame {
            constructor() {
                this.db = db;
                this.playerId = crypto.randomUUID();
                this.roomId = null;
                
                // Состояние игры
                this.gameActive = false;
                this.remotePlayers = []; // Данные из базы
                
                // Локальное состояние моего игрока (для плавного движения без лагов сети)
                this.myLocalPos = { x: 0, y: 0 };
                this.myVelocity = { x: 0, y: 0 };
                
                // Камера
                this.camX = 0;
                this.camY = 0;

                // Canvas
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Input
                this.keys = {};
                this.speed = 8; // Скорость движения
                
                // Network Throttle
                this.lastSendTime = 0;
                this.sendInterval = 30; // Отправлять каждые 30мс для большей плавности

                this.initInput();
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * dpr;
                this.canvas.height = window.innerHeight * dpr;
                this.ctx.scale(dpr, dpr);
                this.w = window.innerWidth;
                this.h = window.innerHeight;
            }

            initInput() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
                });
                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });
            }

            async joinOrCreate() {
                document.getElementById('ui').style.display = 'none';
                
                try {
                    // Ищем комнату с менее чем 4 игроками
                    const q = query(collection(this.db, "rooms"), where("count", "<", 4), limit(1));
                    const snapshot = await getDocs(q);

                    if (!snapshot.empty) {
                        const roomDoc = snapshot.docs[0];
                        this.roomId = roomDoc.id;
                        await this.joinRoom(roomDoc.data().players);
                    } else {
                        // Создаем новую
                        const newPlayer = { id: this.playerId, x: 0, y: 0 };
                        const docRef = await addDoc(collection(this.db, "rooms"), {
                            players: [newPlayer],
                            count: 1,
                            createdAt: serverTimestamp()
                        });
                        this.roomId = docRef.id;
                        this.myLocalPos = { x: 0, y: 0 };
                        this.startListening();
                    }
                } catch (err) {
                    alert("Ошибка сети: " + err.message);
                    location.reload();
                }
            }

            async joinRoom(currentPlayers) {
                await runTransaction(this.db, async (transaction) => {
                    const ref = doc(this.db, "rooms", this.roomId);
                    const snap = await transaction.get(ref);
                    if (!snap.exists()) throw new Error("Комната исчезла");
                    
                    const data = snap.data();
                    if (data.count >= 4) throw new Error("Комната полна");

                    // Спавнимся рядом с центром или случайно
                    const offset = Math.random() * 100 - 50;
                    const newMe = { id: this.playerId, x: offset, y: offset };
                    
                    transaction.update(ref, {
                        players: [...data.players, newMe],
                        count: data.players.length + 1
                    });
                });
                
                // Инициализируем локальную позицию тем же значением
                const meInDb = currentPlayers.find(p => p.id === this.playerId);
                if(meInDb) {
                    this.myLocalPos = { x: meInDb.x, y: meInDb.y };
                } else {
                    this.myLocalPos = { x: 0, y: 0 };
                }

                this.startListening();
            }

            startListening() {
                this.gameActive = true;
                this.canvas.style.display = 'block';
                
                // Слушаем изменения комнаты
                onSnapshot(doc(this.db, "rooms", this.roomId), (docSnap) => {
                    if (!docSnap.exists()) {
                        alert("Комната закрыта");
                        location.reload();
                        return;
                    }
                    // Обновляем список ДРУГИХ игроков (или всех, но свою позицию игнорируем при рендере)
                    this.remotePlayers = docSnap.data().players;
                }, (err) => {
                    console.error(err);
                });
                
                this.loop();
            }

            loop() {
                if (!this.gameActive) return;

                // 1. ОБРАБОТКА ВВОДА И ЛОКАЛЬНОЕ ДВИЖЕНИЕ
                // Это происходит мгновенно, независимо от сети
                let dx = 0;
                let dy = 0;
                if (this.keys['w'] || this.keys['arrowup']) dy -= 1;
                if (this.keys['s'] || this.keys['arrowdown']) dy += 1;
                if (this.keys['a'] || this.keys['arrowleft']) dx -= 1;
                if (this.keys['d'] || this.keys['arrowright']) dx += 1;

                // Нормализация диагонального движения
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx*dx + dy*dy);
                    dx /= length;
                    dy /= length;
                }

                // Применяем скорость
                this.myLocalPos.x += dx * this.speed;
                this.myLocalPos.y += dy * this.speed;

                // ОТПРАВКА ПОЗИЦИИ В БАЗУ (Throttled)
                const now = Date.now();
                if (now - this.lastSendTime > this.sendInterval) {
                    this.updateMyPos(this.myLocalPos.x, this.myLocalPos.y);
                    this.lastSendTime = now;
                }

                // 2. ОБНОВЛЕНИЕ КАМЕРЫ
                // Камера всегда следует за нашей ЛОКАЛЬНОЙ позицией (чтобы не было тряски)
                this.camX += (this.myLocalPos.x - this.camX) * 0.1;
                this.camY += (this.myLocalPos.y - this.camY) * 0.1;

                // 3. РЕНДЕРИНГ
                const ctx = this.ctx;
                const w = this.w;
                const h = this.h;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);

                // Координаты экрана для центра камеры
                const screenCenterX = w / 2;
                const screenCenterY = h / 2;

                // Функция перевода мировых координат в экранные
                const worldToScreen = (wx, wy) => {
                    return {
                        x: wx - this.camX + screenCenterX,
                        y: wy - this.camY + screenCenterY
                    };
                };

                // Рисование сетки
                this.drawGrid(ctx, worldToScreen);

                // Рисование центра мира (0,0)
                this.drawCenterCross(ctx, worldToScreen);

                // Рисование других игроков
                this.remotePlayers.forEach(p => {
                    if (p.id === this.playerId) return; // Себя рисуем отдельно

                    const pos = worldToScreen(p.x, p.y);
                    
                    // Оптимизация: рисуем только если видно на экране
                    if (pos.x > -50 && pos.x < w + 50 && pos.y > -50 && pos.y < h + 50) {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff4444'; // Красный для других
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        
                        // Текст имени
                        ctx.fillStyle = '#aaa';
                        ctx.font = '10px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText("Other", pos.x, pos.y - 15);
                    }
                });

                // Рисование СЕБЯ (белый квадрат/круг)
                const myScreenPos = worldToScreen(this.myLocalPos.x, this.myLocalPos.y);
                ctx.beginPath();
                ctx.arc(myScreenPos.x, myScreenPos.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; // Белый для меня
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0; // Сброс тени
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                requestAnimationFrame(() => this.loop());
            }

            drawGrid(ctx, worldToScreen) {
                const gridSize = 100;
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1;
                ctx.beginPath();

                // Вычисляем границы видимой области в мировых координатах
                const viewLeft = this.camX - this.w / 2;
                const viewTop = this.camY - this.h / 2;
                const viewRight = this.camX + this.w / 2;
                const viewBottom = this.camY + this.h / 2;

                // Вертикальные линии
                let startX = Math.floor(viewLeft / gridSize) * gridSize;
                for (let x = startX; x <= viewRight; x += gridSize) {
                    const s1 = worldToScreen(x, viewTop);
                    const s2 = worldToScreen(x, viewBottom);
                    ctx.moveTo(s1.x, s1.y);
                    ctx.lineTo(s2.x, s2.y);
                }

                // Горизонтальные линии
                let startY = Math.floor(viewTop / gridSize) * gridSize;
                for (let y = startY; y <= viewBottom; y += gridSize) {
                    const s1 = worldToScreen(viewLeft, y);
                    const s2 = worldToScreen(viewRight, y);
                    ctx.moveTo(s1.x, s1.y);
                    ctx.lineTo(s2.x, s2.y);
                }
                
                ctx.stroke();
            }

            drawCenterCross(ctx, worldToScreen) {
                const pos = worldToScreen(0, 0);
                
                // Проверяем видимость
                if (pos.x > -50 && pos.x < this.w + 50 && pos.y > -50 && pos.y < this.h + 50) {
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(pos.x - 20, pos.y);
                    ctx.lineTo(pos.x + 20, pos.y);
                    ctx.moveTo(pos.x, pos.y - 20);
                    ctx.lineTo(pos.x, pos.y + 20);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#ff0000';
                    ctx.font = 'bold 12px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText("CENTER (0,0)", pos.x, pos.y + 30);
                }
            }

            updateMyPos(x, y) {
                // Используем транзакцию для безопасной записи
                runTransaction(this.db, async (transaction) => {
                    const ref = doc(this.db, "rooms", this.roomId);
                    const snap = await transaction.get(ref);
                    if (!snap.exists()) return;
                    
                    const data = snap.data();
                    const idx = data.players.findIndex(p => p.id === this.playerId);
                    if (idx === -1) return;

                    const newPlayers = [...data.players];
                    newPlayers[idx] = { ...newPlayers[idx], x, y };

                    transaction.update(ref, { players: newPlayers });
                }).catch(console.error);
            }
        }

        window.onload = () => {
            const game = new FixedGame();
            document.getElementById('btn-start').onclick = () => game.joinOrCreate();
        };
    </script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { display: none; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; background: rgba(0,0,0,0.9);
        }
        button { 
            padding: 20px 40px; font-size: 24px; background: #fff; color: #000; 
            border: none; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #ccc; }
        h1 { margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .controls-hint { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div id="ui">
    <h1>FIXED MOVEMENT</h1>
    <button id="btn-start">ИГРАТЬ</button>
    <div class="controls-hint">
        Управление: WASD или Стрелки<br>
        Камера следует за вами<br>
        Красный крест = Центр Мира (0,0)<br>
        <span style="color:#00ffcc">Теперь движение должно быть плавным!</span>
    </div>
</div>

<canvas id="game-canvas"></canvas>

</body>
</html>
